[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ringdetect"
version = "1.0.0"
description = "Offline coupon-fraud ring detection over shared devices, cards, addresses and IPs"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "igraph>=0.11", "leidenalg>=0.10"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
ringdetect = "ringdetect.cli:main"

[tool.setuptools]
packages = ["ringdetect"]

[tool.setuptools.package-data]
ringdetect = ["web/*.html", "web/vendor/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::UserWarning"]
